name: Deploy Helm Chart

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Select service to deploy"
        required: true
        type: choice
        options:
          - ui-chart
          - user-service
          - product-service
      image_tag:
        description: "Enter image tag / commit generated by CI"
        required: true
        type: string
      NAMESPACE:
        description: "Enter Namespace to deploy"
        required: true
        type: string
        default: "development"

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER: paymentology-prod-eks

  NAMESPACE: ${{ github.event.inputs.NAMESPACE }}
  SERVICE: ${{ github.event.inputs.service }}
  Image_Tag: ${{ github.event.inputs.image_tag }}


jobs:
  deploy:
    name: Deploy ${SERVICE}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate Inputs
        run: |
          if [ -z "${Image_Tag}" ]; then
            echo "Image tag is mandatory"
            exit 1
          fi
          echo "Service: ${SERVICE}"
          echo "Image Tag: ${Image_Tag}"
          echo "Namespace: ${NAMESPACE}"
      - name: Update image tag in ${SERVICE} values.yaml
        run: |
          SERVICE=${SERVICE}
          IMAGE_TAG=${Image_Tag}
          VALUES_FILE="helm/${SERVICE}/values.yaml"

          if [ ! -f "$VALUES_FILE" ]; then
            echo "values.yaml not found: $VALUES_FILE"
            exit 1
          fi
          echo "Updating $VALUES_FILE"
          sed -i "s/^  tag:.*/  tag: \"${IMAGE_TAG}\"/" $VALUES_FILE
          echo "Updated values.yaml"
          cat $VALUES_FILE
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
          --name $EKS_CLUSTER \
          --region $AWS_REGION
      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Helm Lint
        run: |
          SERVICE=${SERVICE}
          helm lint ./helm/$SERVICE
          
      - name: Deploy Helm Chart
        run: |
          SERVICE=${SERVICE}
          helm upgrade --install $SERVICE \
          ./helm/$SERVICE \
          --namespace $NAMESPACE \
          --create-namespace \
          --wait \
          --timeout 10m

      - name: Verify Deployment
        run: |
          SERVICE=${SERVICE}
          kubectl rollout status deployment/$SERVICE \
          -n $NAMESPACE \
          --timeout=5m
