name: Deploy Helm Chart
permissions:
  contents: write
on:
  workflow_dispatch:
    inputs:
      service:
        description: "Select service to deploy"
        required: true
        type: choice
        options:
          - ui-chart
          - user-service
          - product-service
      aws_region:
        description: "Enter Region Name"
        required: true
        type: string
        default: "ap-south-1"
      image_tag:
        description: "Enter image tag / commit generated by CI"
        required: true
        type: string
      NAMESPACE:
        description: "Enter Namespace to deploy"
        required: true
        type: string
        default: "development"
      branch:
        description: "Select branch"
        required: true
        type: choice
        default: "main"
        options:
          - main
          - develop
          - qa
          - uat
          - prod

env:
  AWS_REGION: ${{ github.event.inputs.aws_region }}
  EKS_CLUSTER: paymentology-prod-eks
  NAMESPACE: ${{ github.event.inputs.NAMESPACE }}
  SERVICE: ${{ github.event.inputs.service }}
  Image_Tag: ${{ github.event.inputs.image_tag }}
  BRANCH: ${{ github.event.inputs.branch }}

jobs:
  deploy:
    name: Deploy Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate Inputs
        run: |
          if [ -z "${Image_Tag}" ]; then
            echo "Image tag is mandatory"
            exit 1
          fi
          echo "Service: ${SERVICE}"
          echo "Image Tag: ${Image_Tag}"
          echo "Namespace: ${NAMESPACE}"
      - name: Update image tag in ${SERVICE} values.yaml
        run: |
          SERVICE=${SERVICE}
          IMAGE_TAG=${Image_Tag}
          VALUES_FILE="helm-chart/${SERVICE}/values.yaml"

          if [ ! -f "$VALUES_FILE" ]; then
            echo "values.yaml not found: $VALUES_FILE"
            exit 1
          fi
          echo "Updating $VALUES_FILE"
          sed -i "s/^  tag:.*/  tag: \"${IMAGE_TAG}\"/" $VALUES_FILE
          echo "Updated values.yaml"
          cat $VALUES_FILE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $VALUES_FILE
          git commit -m "Deploy ${SERVICE} image ${IMAGE_TAG}" || echo "No changes"
          git pull --rebase origin ${BRANCH}
          git push origin ${BRANCH}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
          --name $EKS_CLUSTER \
          --region $AWS_REGION
      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Helm Lint
        run: |
          SERVICE=${SERVICE}
          helm lint ./helm-chart/$SERVICE

      - name: Deploy Helm Chart
        run: |
          SERVICE=${SERVICE}
          helm upgrade --install $SERVICE \
          ./helm-chart/$SERVICE \
          --namespace $NAMESPACE \
          --create-namespace \
          --wait \
          --timeout 20m \
          --atomic \
          --cleanup-on-fail
