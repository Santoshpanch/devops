replicaCount: 1
image:
  repository: 519765643705.dkr.ecr.ap-south-1.amazonaws.com/paymentology/user-service
  tag: "1.0.0"
  pullPolicy: IfNotPresent
labels:
  env: development
service:
  port: 8081
  targetPort: 8081
containerPort: 8081
spring:
  profile: prod
database:
  host: jdbc:postgresql://paymentology-prod-postgres.c9s8g4w0wmyq.ap-south-1.rds.amazonaws.com:5432/paymentology
  port: 5432
  name: paymentology
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 250m
    memory: 512Mi
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70
databaseSecret:
  username: paymentology_admin
  password: ChangeThisStrongPassword123!
podSecurityContext: {}

containerSecurityContext:
  allowPrivilegeEscalation: true
  readOnlyRootFilesystem: false
  runAsUser: 0
volumes:
  - name: nginx-tmp
    emptyDir: {}

volumeMounts:
  - name: nginx-tmp
    mountPath: /tmp
