apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
 name:
  {{ include "user-service.fullname" . }}-networkpolicy
spec:
 podSelector:
  matchLabels:
   {{- include "user-service.labels" . | nindent 4 }}
 policyTypes:
 - Ingress
 - Egress
 ingress:
 - from:
   - podSelector:
       matchLabels:
        app: frontend-ui
   ports:
   - protocol: TCP
     port: 8081
 egress:
 - ports:
   - protocol: TCP
     port: 5432
