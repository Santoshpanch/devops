replicaCount: 1
image:
  repository: 519765643705.dkr.ecr.ap-south-1.amazonaws.com/paymentology/frontend
  tag: "latest"
  pullPolicy: IfNotPresent
labels:
  env: development
service:
  type: ClusterIP
  port: 80
  targetPort: 80
containerPort: 80
ingress:
  enabled: true
  className: alb
  host: paymentology.example.com
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70
backend:
  userService:
    name: user-service
    port: 8081
  productService:
    name: product-service
    port: 8082
# Writable directories required by nginx when root filesystem is read-only
volumes:
  - name: nginx-cache
    emptyDir: {}
  - name: nginx-run
    emptyDir: {}
  - name: nginx-tmp
    emptyDir: {}

volumeMounts:
  - name: nginx-cache
    mountPath: /var/cache/nginx
  - name: nginx-run
    mountPath: /var/run
  - name: nginx-tmp
    mountPath: /tmp
podSecurityContext: {}

containerSecurityContext:
  allowPrivilegeEscalation: true
  readOnlyRootFilesystem: false
  runAsUser: 0
